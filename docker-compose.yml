services:
  memgraph:
    image: memgraph/memgraph-platform:latest
    ports:
      - "7687:7687"
      - "9091:9091"
      - "3000:3000"
      - "7444:7444"
    restart: always

  codeexplorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeexplorer:latest
    ports:
      - "8085:8085"
    environment:
      - WORKSPACE_ROOT=${WORKSPACE_ROOT:-}
    volumes:
      - ${HOST_ROOT:-/}:/host
    command: ["mcp", "--port", "8085", "--bolt-url", "bolt://memgraph:7687"]
    depends_on:
      - memgraph
    restart: always
