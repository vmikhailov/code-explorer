services:
  codeexplorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeexplorer:latest
    ports:
      - "8085:8085"
    environment:
      - WORKSPACE_ROOT=${WORKSPACE_ROOT:-}
    volumes:
      - ${HOST_ROOT:-/}:/host
      - ./data:/data
    command: ["mcp", "--port", "8085", "--db-path", "/data/graph.db"]
    restart: always
