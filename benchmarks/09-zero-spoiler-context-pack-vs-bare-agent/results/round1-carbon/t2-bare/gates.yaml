  - [SIG-TWENTY-007, PassedTolerated, Error, 0, 6, No Silent Exception Swallowing, Production TypeScript code in twenty-server must not contain empty catch blocks without an explicit explanatory comment or error handling., "Handle, rethrow, or log the caught error, or document why the exception is intentionally ignored."]