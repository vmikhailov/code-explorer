id: SIG-TWENTY-003
category: Architectural
platform: agnostic
scope: Module
dimension: Boundaries
name: "Cross-Module Table Encapsulation"
severity: Error
description: "Core modules in twenty-server (src/engine/core-modules/<module>/**) must not introduce new direct database reads or writes (READS_FROM|WRITES_TO) against tables whose owning TypeORM Entity is defined in another core module. Access external domain data through the owning module's exported service."
remediation: "Do not register another core module's TypeORM Entity or query its table directly via Repository/DataSource; import the owning domain module and call its exported service instead."
target: "{t.name}"
message: "Class '{c.name}' in module '{split(c.path, '/')[5]}' directly accesses table '{t.name}' owned by '{e.name}' in '{e.path}'"
thresholds:
  warning: 1
  error: 1
ratchet:
  enabled: true
  baseline: baselines/SIG-TWENTY-003.json
query: |
  MATCH (c:Type)-[:HAS_METHOD]->(fn:Function)-[:READS_FROM|WRITES_TO]->(t:Table)-[:IMPLEMENTED_BY]->(e:Type)
  WHERE c.path STARTS WITH 'packages/twenty-server/src/engine/core-modules/'
    AND e.path STARTS WITH 'packages/twenty-server/src/engine/core-modules/'
    AND split(c.path, '/')[5] <> split(e.path, '/')[5]
    AND NOT coalesce(fn.is_test, false)
  RETURN DISTINCT c, t, e
