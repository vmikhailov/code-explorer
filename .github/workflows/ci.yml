name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build cli/CodeExplorer.slnx -c Release /warnaserror

      - name: Run test suite
        run: dotnet test cli/CodeExplorer.slnx -c Release --no-build /warnaserror
