name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build cli/CodeExplorer.slnx -c Release

      - name: Run test suite
        run: dotnet test cli/CodeExplorer.slnx -c Release --no-build -m:1 --logger "console;verbosity=normal"

      - name: Verify Architecture Gates
        run: |
          dotnet run --project cli/src/UI/CodeExplorer/CodeExplorer.csproj -c Release --no-build -- gate check -g SIG-P-B-005,SIG-C-B-002 --auto-init --scan --clear

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test VS Code Extension
        working-directory: ./vscode-extension
        run: |
          npm ci
          npm run typecheck
          npm run test
