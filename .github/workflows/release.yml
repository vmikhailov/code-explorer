name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.49.4). Leave empty to use pushed tag or latest tag.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write  # Required for NuGet Trusted Publishing (OIDC)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-tag:
    name: Resolve Release Tag & Version
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and semver
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" cli/Directory.Build.props 2>/dev/null || echo "1.0.0")
              TAG="v${VERSION}"
            fi
          fi

          VERSION="${TAG#v}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG, version: $VERSION"

  build-matrix:
    name: Build ${{ matrix.rid }}
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
            bin_name: ce
          # Windows x64
          - os: windows-latest
            rid: win-x64
            archive: zip
            bin_name: ce.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish Single-File Binary
        shell: bash
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          echo "Publishing version: $VERSION"
          dotnet publish cli/src/UI/CodeExplorer/CodeExplorer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:PackageVersion="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION" \
            -p:InformationalVersion="$VERSION" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o ./out/${{ matrix.rid }}

      - name: Package Artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd ./out/${{ matrix.rid }}
          chmod +x ${{ matrix.bin_name }}
          tar -czf ../../ce-${{ matrix.rid }}.tar.gz ${{ matrix.bin_name }}

      - name: Package Artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path ./out/${{ matrix.rid }}/${{ matrix.bin_name }} -DestinationPath ./ce-${{ matrix.rid }}.zip

      - name: Upload Artifact to Job
        uses: actions/upload-artifact@v4
        with:
          name: ce-${{ matrix.rid }}
          path: ce-${{ matrix.rid }}.${{ matrix.archive }}

  create-release:
    name: Create GitHub Release & Publish NuGet
    needs: [resolve-tag, build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Build NuGet Dotnet Tool Package
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          echo "Packing NuGet tool version: $VERSION"
          dotnet pack cli/src/UI/CodeExplorer/CodeExplorer.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -p:PackageVersion="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION" \
            -p:InformationalVersion="$VERSION" \
            -o ./dist

      - name: Generate Checksums
        run: |
          cd ./dist
          sha256sum * > checksums.txt || true
          cat checksums.txt

      - name: Generate Rich Release Notes
        run: |
          TAG_NAME="${{ needs.resolve-tag.outputs.tag_name }}"
          python3 .github/scripts/generate-release-notes.py "$TAG_NAME" CHANGELOG.md RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
          name: "CodeExplorer ${{ needs.resolve-tag.outputs.tag_name }}"
          body_path: RELEASE_BODY.md
          files: |
            ./dist/*
          draft: false
          prerelease: false

      - name: Update Homebrew Tap Formula
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap formula update."
            exit 0
          fi

          if [ ! -f ./dist/ce-osx-arm64.tar.gz ]; then
            echo "::warning::./dist/ce-osx-arm64.tar.gz not found; skipping Homebrew tap formula update."
            exit 0
          fi

          SHA256_ARM64=$(sha256sum ./dist/ce-osx-arm64.tar.gz | awk '{print $1}')
          echo "Updating vmikhailov/homebrew-tap formula for ce v${VERSION} (sha256: ${SHA256_ARM64})..."

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/vmikhailov/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          mkdir -p Formula
          cat <<EOF | sed 's/^          //' > Formula/ce.rb
          class Ce < Formula
            desc "Codebase intelligence CLI and knowledge graph engine"
            homepage "https://github.com/vmikhailov/code-explorer"
            version "${VERSION}"
            license "MIT"

            depends_on :macos
            depends_on arch: :arm64

            url "https://github.com/vmikhailov/code-explorer/releases/download/v${VERSION}/ce-osx-arm64.tar.gz"
            sha256 "${SHA256_ARM64}"

            def install
              bin.install "ce"
            end

            test do
              assert_match "ce", shell_output("#{bin}/ce --version", 2) rescue nil
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ce.rb

          if git diff --staged --quiet; then
            echo "Formula/ce.rb is already up to date."
          else
            git commit -m "feat(ce): update formula to v${VERSION}"
            git push origin main
            echo "Successfully updated and pushed vmikhailov/homebrew-tap."
          fi

      - name: NuGet Login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: vmikhailov

      - name: Push to NuGet.org
        continue-on-error: true
        env:
          MANUAL_KEY: ${{ secrets.NUGET_API_KEY }}
          OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          API_KEY="${OIDC_KEY:-$MANUAL_KEY}"
          if [ -n "$API_KEY" ]; then
            for i in 1 2 3; do
              echo "Pushing to NuGet.org (attempt $i)..."
              if dotnet nuget push ./dist/*.nupkg --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 180; then
                echo "Successfully published to NuGet.org"
                exit 0
              fi
              echo "NuGet push attempt $i failed. Retrying in 10s..."
              sleep 10
            done
            echo "::warning::Failed to push to NuGet.org after 3 attempts."
          else
            echo "::warning::No NuGet API key or OIDC token available."
          fi

  package-and-publish-extension:
    name: Package & Publish VS Code Extension
    needs: [resolve-tag, build-matrix, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./vscode-extension
        run: npm ci

      - name: Typecheck and Test Extension
        working-directory: ./vscode-extension
        run: |
          npm run typecheck
          npm run test

      - name: Sync Changelog from Repository Root
        working-directory: ./vscode-extension
        run: |
          if [ -f ../CHANGELOG.md ]; then
            cp ../CHANGELOG.md ./CHANGELOG.md
            echo "Synchronized ../CHANGELOG.md -> ./CHANGELOG.md"
          fi

      - name: Build and Package Extension (Lightweight Universal)
        working-directory: ./vscode-extension
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          if [ -n "$VERSION" ] && [ "$VERSION" != "main" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          npm run package

      - name: Upload Extension VSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: ./vscode-extension/dist-vsix/*.vsix
          if-no-files-found: error

      - name: Upload Extension VSIX Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
          files: |
            ./vscode-extension/dist-vsix/*.vsix

      - name: Publish to Marketplaces
        continue-on-error: true
        working-directory: ./vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:all
