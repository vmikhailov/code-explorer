name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required for NuGet Trusted Publishing (OIDC)

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-matrix:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
            bin_name: ce
          # macOS Intel
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
            bin_name: ce
          # Linux x64
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            bin_name: ce
          # Linux ARM64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive: tar.gz
            bin_name: ce
          # Windows x64
          - os: windows-latest
            rid: win-x64
            archive: zip
            bin_name: ce.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish Single-File Binary
        shell: bash
        run: |
          dotnet publish src/UI/CodeExplorer/CodeExplorer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o ./out/${{ matrix.rid }}

      - name: Package Artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd ./out/${{ matrix.rid }}
          chmod +x ${{ matrix.bin_name }}
          tar -czf ../../ce-${{ matrix.rid }}.tar.gz ${{ matrix.bin_name }}

      - name: Package Artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path ./out/${{ matrix.rid }}/${{ matrix.bin_name }} -DestinationPath ./ce-${{ matrix.rid }}.zip

      - name: Upload Artifact to Job
        uses: actions/upload-artifact@v4
        with:
          name: ce-${{ matrix.rid }}
          path: ce-${{ matrix.rid }}.${{ matrix.archive }}

  create-release:
    name: Create GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Checkout repository (for NuGet pack)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build NuGet Dotnet Tool Package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          dotnet pack src/UI/CodeExplorer/CodeExplorer.csproj -c Release -p:PackageVersion="$VERSION" -o ./dist

      - name: NuGet Login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: vmikhailov

      - name: Push to NuGet.org
        env:
          MANUAL_KEY: ${{ secrets.NUGET_API_KEY }}
          OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          API_KEY="${OIDC_KEY:-$MANUAL_KEY}"
          if [ -n "$API_KEY" ]; then
            dotnet nuget push ./dist/*.nupkg --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "::warning::No NuGet API key or OIDC token available."
          fi

      - name: Generate Checksums
        run: |
          cd ./dist
          sha256sum * > checksums.txt || true
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
