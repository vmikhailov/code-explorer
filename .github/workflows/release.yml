name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # Required for NuGet Trusted Publishing (OIDC)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-matrix:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
            bin_name: ce
          # macOS Intel
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
            bin_name: ce
          # Linux x64
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            bin_name: ce
          # Linux ARM64
          - os: ubuntu-latest
            rid: linux-arm64
            archive: tar.gz
            bin_name: ce
          # Windows x64
          - os: windows-latest
            rid: win-x64
            archive: zip
            bin_name: ce.exe
          # Windows ARM64
          - os: windows-latest
            rid: win-arm64
            archive: zip
            bin_name: ce.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish Single-File Binary
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          echo "Publishing version: $VERSION"
          dotnet publish cli/src/UI/CodeExplorer/CodeExplorer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version="$VERSION" \
            -p:PackageVersion="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION" \
            -p:InformationalVersion="$VERSION" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o ./out/${{ matrix.rid }}

      - name: Package Artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd ./out/${{ matrix.rid }}
          chmod +x ${{ matrix.bin_name }}
          tar -czf ../../ce-${{ matrix.rid }}.tar.gz ${{ matrix.bin_name }}

      - name: Package Artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path ./out/${{ matrix.rid }}/${{ matrix.bin_name }} -DestinationPath ./ce-${{ matrix.rid }}.zip

      - name: Upload Artifact to Job
        uses: actions/upload-artifact@v4
        with:
          name: ce-${{ matrix.rid }}
          path: ce-${{ matrix.rid }}.${{ matrix.archive }}

  create-release:
    name: Create GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Build NuGet Dotnet Tool Package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          echo "Packing NuGet tool version: $VERSION"
          dotnet pack cli/src/UI/CodeExplorer/CodeExplorer.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -p:PackageVersion="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION" \
            -p:InformationalVersion="$VERSION" \
            -o ./dist

      - name: Generate Checksums
        run: |
          cd ./dist
          sha256sum * > checksums.txt || true
          cat checksums.txt

      - name: Generate Rich Release Notes
        run: |
          python3 .github/scripts/generate-release-notes.py "${{ github.ref_name }}" CHANGELOG.md RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CodeExplorer ${{ github.ref_name }}"
          body_path: RELEASE_BODY.md
          files: |
            ./dist/*
          draft: false
          prerelease: false

      - name: NuGet Login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: vmikhailov

      - name: Push to NuGet.org
        continue-on-error: true
        env:
          MANUAL_KEY: ${{ secrets.NUGET_API_KEY }}
          OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          API_KEY="${OIDC_KEY:-$MANUAL_KEY}"
          if [ -n "$API_KEY" ]; then
            for i in 1 2 3; do
              echo "Pushing to NuGet.org (attempt $i)..."
              if dotnet nuget push ./dist/*.nupkg --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 180; then
                echo "Successfully published to NuGet.org"
                exit 0
              fi
              echo "NuGet push attempt $i failed. Retrying in 10s..."
              sleep 10
            done
            echo "::warning::Failed to push to NuGet.org after 3 attempts."
          else
            echo "::warning::No NuGet API key or OIDC token available."
          fi

  package-and-publish-extension:
    name: Package & Publish VS Code Extension
    needs: [build-matrix, create-release]
    if: always() && !cancelled() && needs.build-matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./vscode-extension
        run: npm ci

      - name: Typecheck and Test Extension
        working-directory: ./vscode-extension
        run: |
          npm run typecheck
          npm run test

      - name: Sync Changelog from Repository Root
        working-directory: ./vscode-extension
        run: |
          if [ -f ../CHANGELOG.md ]; then
            cp ../CHANGELOG.md ./CHANGELOG.md
            echo "Synchronized ../CHANGELOG.md -> ./CHANGELOG.md"
          fi

      - name: Build and Package Extension for all Platforms
        working-directory: ./vscode-extension
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -n "$VERSION" ] && [ "$VERSION" != "main" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          npm run package

      - name: Upload Extension VSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: ./vscode-extension/dist-vsix/*.vsix
          if-no-files-found: error

      - name: Upload Extension VSIX Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./vscode-extension/dist-vsix/*.vsix

      - name: Publish to Marketplaces
        continue-on-error: true
        working-directory: ./vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:all

